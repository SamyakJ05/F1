<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e0f"/>
      <stop offset="100%" stop-color="#050707"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle badge for crisp contrast on both light and dark browser tabs -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#252b29" stroke-width="2"/>
  
  <!-- Apex Atlas Signature Aerodynamic Chevron Symbol -->
  <polygon points="26,24 102,24 75.4,53.64 102,53.64 61.04,104 68.64,64.28 26,64.28" fill="#c7ff31" filter="url(#subtleGlow)"/>
</svg>